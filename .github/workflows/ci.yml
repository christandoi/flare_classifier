# on every push to main and every pull request: check formatting, then run the unit tests
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest black

      - name: Check formatting
        run: black --check .

      - name: Run tests
        run: pytest
